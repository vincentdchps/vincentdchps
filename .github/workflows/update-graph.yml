name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activity-graph.svg
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=vincentdchps&theme=gotham&hide_border=true" \
            --output dist/activity-graph.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
